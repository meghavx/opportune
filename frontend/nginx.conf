server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # In local development, Vite serves the React app.
    # In Docker, React is built into static files and Nginx is used to serve them.
    # Nginx also acts as the entry point for API requests.

    # Forward API requests to the Spring Boot backend.
    # The browser only talks to the frontend; Nginx handles the backend routing.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router handles frontend routes such as /students and /companies.
    # If Nginx can't find a matching file, send the request to index.html
    # so React Router can handle the route instead of returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}