services:

  # MySQL database used by the backend
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: opportune
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    
    # Expose MySQL only to the local machine, not the network
    ports:
      - "127.0.0.1:3307:3306"
    
    # Keep database data even when the MySQL container is recreated
    volumes:
      - mysql-data:/var/lib/mysql
    
    # Make sure MySQL is ready before starting the backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}"
          --password="$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}"
          --execute='SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Spring Boot backend that handles the application's API and business logic
  backend:
    image: opportune-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    
    # Start the backend only after MySQL passes its health check
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/opportune
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:?Set MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Opportune Local Admin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@opportune.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-noreply@opportune.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    
    # Expose the API only to the local machine
    ports:
      - "127.0.0.1:8080:8080"

  # React frontend built into static files and served by Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    # Backend must be available for API requests
    depends_on:
      - backend
    
    # Serve the frontend at localhost:5173
    ports:
      - "127.0.0.1:5173:80"

# Named volume to keep MySQL data independent of the container lifecycle
volumes:
  mysql-data: